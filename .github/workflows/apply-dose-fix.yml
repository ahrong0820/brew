name: Apply timer dose fix

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/preserve-timer-dose-on-start'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source and E2E changes
        run: python .github/apply-dose-fix.py

      - name: Commit applied changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx e2e/catalog-storage-timer-flow.mjs
          git commit -m "fix: preserve selected dose when timer starts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
