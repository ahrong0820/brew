name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-failure-${{ github.run_id }}
          path: test-failure.log
          if-no-files-found: ignore
          retention-days: 3

  static-build:
    name: static build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write deployment metadata and recipe manifest
        run: |
          mkdir -p public/deployments
          cat > public/deployment.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp public/deployment.json "public/deployments/${GITHUB_SHA}.json"
          pnpm run write:recipe-manifest "$GITHUB_SHA"

      - name: Build GitHub Pages static export
        run: pnpm build:github
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /brew
          NEXT_PUBLIC_DEPLOYMENT_SHA: ${{ github.sha }}

      - name: Validate static export
        run: |
          pnpm run validate:static-export out "$GITHUB_SHA"
          pnpm run validate:recipe-content out/index.html

      - name: Upload static export for browser E2E
        uses: actions/upload-artifact@v7
        with:
          name: pr-static-export-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 1

  browser-e2e:
    name: browser E2E
    needs: static-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download static export
        uses: actions/download-artifact@v8
        with:
          name: pr-static-export-${{ github.run_id }}
          path: out

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
